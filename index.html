<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wood Match - Permainan Furnitur</title>
    <meta name="description" content="Cocokkan furnitur kayu dalam permainan puzzle yang menyenangkan!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
        <!-- Language Toggle -->
        <div class="lang-toggle">
            <button class="lang-btn active" data-lang="id">🇮🇩 ID</button>
            <button class="lang-btn" data-lang="zh">🇨🇳 中文</button>
        </div>

        <div class="logo-container">
            <div class="brand-logo">
                <span class="logo-icon">🪵</span>
                <h1>Wood Match</h1>
            </div>
            <p class="tagline" data-i18n="tagline">Permainan Furnitur Kayu</p>
        </div>

        <div class="level-select">
            <button class="level-btn tutorial-btn" data-level="1">
                <span class="level-icon">🌿</span>
                <span class="level-name" data-i18n="tutorial">Tutorial</span>
                <span class="level-desc" data-i18n="level1Desc">Tingkat 1 - Mudah</span>
            </button>
            <button class="level-btn challenge-btn" data-level="2">
                <span class="level-icon">🔥</span>
                <span class="level-name" data-i18n="challenge">Tantangan</span>
                <span class="level-desc" data-i18n="level2Desc">Tingkat 2 - Sulit</span>
            </button>
        </div>

        <button id="start-btn" class="primary-btn">
            <span data-i18n="startGame">Mulai Main</span>
            <span class="btn-icon">▶</span>
        </button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <header class="game-header">
            <button id="back-btn" class="icon-btn">
                <span>←</span>
            </button>
            <div class="level-indicator">
                <span id="current-level" data-i18n="level1">Tingkat 1</span>
                <span class="level-subtitle" id="level-subtitle">Tutorial</span>
            </div>
            <button id="sound-btn" class="icon-btn">
                <span id="sound-icon">🔊</span>
            </button>
        </header>

        <main class="game-area">
            <div id="tile-container" class="tile-container">
                <!-- Tiles will be generated here -->
            </div>
        </main>

        <footer class="game-footer">
            <div id="slot-container" class="slot-container">
                <div class="slot" data-index="0"></div>
                <div class="slot" data-index="1"></div>
                <div class="slot" data-index="2"></div>
                <div class="slot" data-index="3"></div>
                <div class="slot" data-index="4"></div>
                <div class="slot" data-index="5"></div>
                <div class="slot" data-index="6"></div>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <p class="progress-text"><span data-i18n="remaining">Sisa</span>: <span id="tiles-remaining">0</span> <span
                    data-i18n="tiles">ubin</span></p>
        </footer>
    </div>

    <!-- Victory Modal -->
    <div id="victory-modal" class="modal">
        <div class="modal-content victory">
            <div class="confetti-container">
                <div class="confetti"></div>
                <div class="confetti"></div>
                <div class="confetti"></div>
                <div class="confetti"></div>
                <div class="confetti"></div>
            </div>
            <div class="victory-icon">🏆</div>
            <h2 data-i18n="congratulations">Selamat!</h2>
            <p class="victory-message" data-i18n="victoryMessage">Anda telah membuka set furnitur mewah!</p>
            <div class="furniture-showcase" id="furniture-showcase">
                <!-- Unlocked furniture will show here -->
            </div>
            <div class="modal-buttons">
                <button id="claim-btn" class="primary-btn">
                    <span data-i18n="claimPrize">Klaim Hadiah</span>
                    <span class="btn-icon">🎁</span>
                </button>
                <button id="next-level-btn" class="secondary-btn" data-i18n="nextLevel">Tingkat Berikutnya</button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" class="modal">
        <div class="modal-content gameover">
            <div class="gameover-icon">😔</div>
            <h2 data-i18n="gameOver">Permainan Berakhir</h2>
            <p class="gameover-message" data-i18n="gameOverMessage">Slot sudah penuh! Coba lagi?</p>
            <div class="modal-buttons">
                <button id="retry-btn" class="primary-btn">
                    <span data-i18n="tryAgain">Coba Lagi</span>
                    <span class="btn-icon">🔄</span>
                </button>
                <button id="home-btn" class="secondary-btn" data-i18n="mainMenu">Menu Utama</button>
            </div>
        </div>
    </div>

    <!-- Claim Prize Modal -->
    <div id="claim-modal" class="modal">
        <div class="modal-content claim">
            <div class="claim-icon">🎉</div>
            <h2 data-i18n="yourPrize">Hadiah Anda!</h2>
            <p class="claim-message" data-i18n="showScreen">Tunjukkan layar ini kepada staff kami untuk menerima hadiah
                spesial!</p>
            <div class="qr-placeholder">
                <div class="qr-box">
                    <span>📱</span>
                    <p>KODE: WOOD2024</p>
                </div>
            </div>
            <button id="close-claim-btn" class="primary-btn" data-i18n="close">Tutup</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
